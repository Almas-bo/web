            <a class="navbar-brand fw-bold" href="index.html">KicksLab</a>

                <span class="navbar-toggler-icon"></span>

                <ul class="navbar-nav ms-auto">

            <div class="d-flex gap-2 ms-lg-3 mt-2 mt-lg-0">
                <button type="button" class="btn btn-warning btn-sm open-popup">Subscribe</button>
                <button type="button" class="btn btn-outline-light btn-sm bg-color-btn">🎨 Change Color</button>
            </div>

            </div>
        </div>

    <main class="container my-4 my-lg-5 flex-grow-1">
        <h2 class="mb-4 text-center">About Our Team</h2>
        <div class="row g-4 text-center">
            <div class="col-md-4">
                <div class="card p-3 shadow-sm h-100">
                    <img src="https://i.pinimg.com/736x/a5/13/25/a51325ae27836d15b3a57be164c48c7a.jpg" class="profile-img-bs mx-auto mb-3" alt="Student 1">
                    <h5>Yersultan Sansyzbay</h5>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 shadow-sm h-100">
                    <img src="https://i.pinimg.com/1200x/39/81/b0/3981b00c5cc193f4d59f1ec19c294b86.jpg" class="profile-img-bs mx-auto mb-3" alt="Student 2">
                    <h5>Almas Bekenov</h5>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 shadow-sm h-100">
                    <img src="https://i.pinimg.com/736x/cc/d7/77/ccd777f5658060590cc7ffabedf0450a.jpg" class="profile-img-bs mx-auto mb-3" alt="Student 3">

    <footer class="bg-dark text-white text-center py-3 mt-auto">

            <p class="mb-0">© 2026 KicksLab. Team Members: Yersultan Sansyzbay, Almas Bekenov, Dinmukhamed Bolat.</p>

        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<div class="popup-overlay" id="signupPopup" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
    <div class="popup-box">
        <button type="button" class="popup-close" aria-label="Close">&times;</button>
        <h4 class="mb-3" id="popupTitle">Subscribe to KicksLab</h4>
        <div class="alert alert-success d-none" id="signupSuccess"></div>
        <form id="signupForm" novalidate>
            <div class="mb-3"><label class="form-label" for="su-name">Name</label>
                <input type="text" class="form-control" id="su-name" name="name" placeholder="Your name"></div>
            <div class="mb-3"><label class="form-label" for="su-email">Email</label>
                <input type="email" class="form-control" id="su-email" name="email" placeholder="name@example.com"></div>
            <div class="mb-3"><label class="form-label" for="su-pass">Password</label>
                <input type="password" class="form-control" id="su-pass" name="password" placeholder="Min. 8 characters"></div>
            <div class="mb-3"><label class="form-label" for="su-confirm">Confirm password</label>
                <input type="password" class="form-control" id="su-confirm" name="confirm" placeholder="Repeat password"></div>
            <button type="submit" class="btn btn-dark w-100">Subscribe</button>
        </form>
    </div>
</div>

<script src="js/main.js"></script>

</body>
